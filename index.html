<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="style.css">
    <title>cloth market</title>
</head>
<body>
    <div class="wrapper">
        <header class="header">
            <div class="header_mobile_container">
                <img src="img/burger_menu.png" class="burger_mobile_logo" alt=""/>
                <img src="img/search_logo.png" class="header_logo" alt=""/>
            </div>
            <div class="website_logo_container">
                <img class="website_logo" src="img/website_logo.png" alt="">
                <img src="img/burger_menu.png" class="burger_logo" alt=""/>
            </div>
            <div class="header_menu">
                <p class="header_menu_text">Одежда ⌄</p>
                <p class="header_menu_text">Обувь ⌄</p>
                <p class="header_menu_text">Аксессуары ⌄</p>
                <p class="header_menu_text">Бренды ⌄</p>
                <p class="header_menu_text">Расчет стоимости ⌄</p>
                <p class="header_menu_text">Информация ⌄</p>
            </div>
            <div class="header_logotips">
                <img src="img/search_logo.png" class="search_logo" alt=""/>
                <img src="img/star_logo.png" class="star_logo" alt=""/>
                <img src="img/people_logo.png" class="people_logo" alt=""/>
                <div class="price_container">
                    <img src="img/shop_logo.png" class="shop_logo" alt=""/>
                    <span class="price_text">11 899 ₽</span>
                    <img src="img/new_logo.png" class="new_logo" alt=""/>
                </div>
            </div>
        </header>
        <main class="main"></main>
        <footer class="footer"></footer>
    </div>
</body>
</html>
